[package]
name = "psi-vole"
version = "0.1.0"
edition = "2021"

[lib]
name = "psi_vole"
path = "src/lib.rs"

[dependencies]
psi-aes = { path = "psi-aes" }
aes = "0.8.4"
rand = "0.8"
rand_chacha = "0.9.0"
tokio = { version = "1", features = ["full"] }
p256 = { version = "0.13.2", features = ["ecdh"] }
sha3 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
clap = "4.5.28"
libc = "0.2"
ff = { path = "/home/ubuntu/.cargo/git/checkouts/ff-4a06948a8ccc4786/c29da06", features = ["derive"] }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[[bin]]
name = "ot"

[[bin]]
name = "cope"

[[bin]]
name = "test_field"

[[bin]]
name = "receiver_tcp"

[[bin]]
name = "sender_tcp"

[[bin]]
name = "base_svole"

[[bin]]
name = "test_mul"

[[bin]]
name = "spfss"

[[bin]]
name = "mpfss"

[[bin]]
name = "vole_triple"

[[bin]]
name = "test_block"

[[bin]]
name = "test_fri"

[[bin]]
name = "oprf"

[[bin]]
name = "test_rayon"

[[bin]]
name = "test_fft"

[[bin]]
name = "test_vole_triple_1m_tcp"
