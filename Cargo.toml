[package]
name = "circuit-psi"
version = "0.1.0"
edition = "2024"

[dependencies]
curve25519-dalek = "4"
rand_core = "0.10.1"
rand = "0.10.1"
anyhow = "1.0.102"
eyre = "0.6.12"
ff = { git = "https://github.com/GaloisInc/ff", rev = "1a4c6138e2e76e13f8d54fae81857e2cea3cbc4d", features = ["derive"] }
generic-array = "1.3.5"
lambdaworks-math = "0.13.0"
num-traits = "0.2.19"
rand08 = { package = "rand", version = "0.8.5" }
rayon = "1.12.0"
fourq = "0.1.6"
crypto-bigint = "0.5.5"
serde = { version = "1.0.228", features = ["derive"] }
subtle = "=2.5.0"
swanky-channel-legacy = { package = "scuttlebutt", git = "https://github.com/GaloisInc/swanky", rev = "553ede0" }
swanky-field-binary = { git = "https://github.com/GaloisInc/swanky", package = "swanky-field-binary", rev = "553ede0" }
swanky-field = { git = "https://github.com/GaloisInc/swanky", package = "swanky-field", rev = "553ede0" }
swanky-party = { git = "https://github.com/GaloisInc/swanky", package = "swanky-party", rev = "553ede0" }
swanky-serialization = { git = "https://github.com/GaloisInc/swanky", package = "swanky-serialization", rev = "553ede0" }
psi-aes = { path = "src/psi-aes" }
aes = "0.8.4"
p256 = "0.13.2"
clap = { version = "4.5.38", features = ["derive"] }
sha2 = "0.10.8"
blst = "0.3.16"
blstrs = "0.7.1"
group = "0.13.0"
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
pasta_curves = "0.5.1"
ark-pallas = "0.5.0"

[[bin]]
name = "vole_cope"
path = "src/vole/bin/cope.rs"

[[bin]]
name = "triples_test"
path = "src/mascot/bin/triples_test.rs"

[[bin]]
name = "test_psi_cardinality"
path = "src/bin/circuit-psi/test_psi_cardinality.rs"

[[bin]]
name = "create_fake_triples"
path = "src/bin/bedoza/create_fake_triples.rs"

[[bin]]
name = "create_fake_triples_interactive"
path = "src/bin/bedoza/create_fake_triples_interactive.rs"

[[bin]]
name = "test_batch_multiply"
path = "src/bin/bedoza/test_batch_multiply.rs"

[[bin]]
name = "test_mq_rpmt"
path = "src/bin/circuit-psi/test_mq_rpmt.rs"

[[bin]]
name = "inspect_shuffled_oprf"
path = "src/bin/circuit-psi/inspect_shuffled_oprf.rs"

[[bin]]
name = "test_psi_sum"
path = "src/bin/circuit-psi/test_psi_sum.rs"

[[bin]]
name = "test_one_side_psu"
path = "src/bin/circuit-psi/test_one_side_psu.rs"

[[bin]]
name = "test_two_side_psu"
path = "src/bin/circuit-psi/test_two_side_psu.rs"

[[bin]]
name = "bench_fourq_fe_mul"
path = "src/bin/field-bench/bench_fourq_fe_mul.rs"

[[bin]]
name = "bench_lambdaworks_fourq_mul"
path = "src/bin/field-bench/bench_lambdaworks_fourq_mul.rs"

[[bin]]
name = "bench_fe_sampling_strategies"
path = "src/bin/tools-bench/bench_fe_sampling_strategies.rs"

[[bin]]
name = "test_buffered_vole_wrapper"
path = "src/bin/tools-bench/test_buffered_vole_wrapper.rs"

[profile.release]
lto = true
